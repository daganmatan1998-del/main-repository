<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VANTÉ</title>
  <meta name="description" content="A VANTÉ piece in black and white, printed to order on heavyweight cotton.">
  <meta name="theme-color" content="#0b0b0a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="VANTÉ">
  <meta property="og:description" content="A VANTÉ piece in black and white, printed to order on heavyweight cotton.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://d2ol7oe51mr4n9.cloudfront.net" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/jost-latin-400-normal.woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/vante.css">
</head>
<body data-page="product" data-custom-motion>

<main id="main" class="main">
<div class="wrap">
    <div class="pdp" data-pdp>
      <div class="pdp__gallery">
        <div class="pdp__hero" data-pdp-hero role="button" tabindex="0" aria-label="Zoom image"><img alt="" data-pdp-img width="880" height="1100" fetchpriority="high"></div>
        <div class="pdp__thumbs" data-pdp-thumbs role="group" aria-label="Product images"></div>
        <div class="pdp__editorial" data-pdp-editorial></div>
      </div>
      <div class="pdp__info">
        <nav class="pdp__crumbs" aria-label="Breadcrumb" data-crumbs></nav>
        <div style="display:grid;gap:14px">
          <p class="label muted" data-pdp-kicker></p>
          <h1 class="pdp__title" data-pdp-name></h1>
          <div class="pdp__price"><span data-pdp-price></span><span class="label muted" data-pdp-limited></span></div>
          <p class="lead" data-pdp-line></p>
        </div>
        <div data-pdp-picker style="display:grid;gap:24px"></div>
        <button type="button" class="wish-btn" data-wish aria-pressed="false"></button>
        <ul class="pdp__notes" data-pdp-notes></ul>
        <div class="accordion" data-pdp-acc></div>
      </div>
    </div>
  </div>
  <section class="section wrap" aria-labelledby="rel-title">
    <div class="section-head"><div class="section-head__title"><p class="label muted">You may also consider</p><h2 class="h2" id="rel-title">From the <span class="italic">house</span></h2></div>
    <a class="label link-underline" href="shop.html">All pieces</a></div>
    <div class="products" data-related></div>
  </section>
  <div class="sticky-buy" data-sticky-buy aria-hidden="true"><span class="sticky-buy__name" data-sticky-name></span><button type="button" class="btn btn--small" data-sticky-add tabindex="-1">Choose size</button></div>
</main>

<noscript><p style="padding:24px;text-align:center">VANTÉ needs JavaScript for the bag and checkout. Please enable it to shop.</p></noscript>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/vendor/lenis.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/media.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/product.js"></script>
</body>
</html>
