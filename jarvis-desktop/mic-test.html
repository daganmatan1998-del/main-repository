<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — microphone check</title>
<style>
  :root{ --cyan:#00e5ff; --dim:#7fa8b8; --bg:#00060e; --warn:#ffb020; --bad:#ff5a5a; --ok:#3ddc84; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--cyan); min-height:100vh;
    font-family:'Share Tech Mono', ui-monospace, Consolas, monospace;
    padding:28px 20px 60px; line-height:1.6;
  }
  .wrap{ max-width:680px; margin:0 auto; }
  h1{ font-size:15px; letter-spacing:5px; font-weight:400; margin-bottom:4px; }
  .sub{ color:var(--dim); font-size:12px; letter-spacing:1px; margin-bottom:26px; }

  .meter{
    height:34px; border:1px solid rgba(0,229,255,0.35); position:relative;
    background:rgba(0,229,255,0.04); overflow:hidden; margin-bottom:6px;
  }
  #bar{ position:absolute; inset:0 auto 0 0; width:0%; background:rgba(0,229,255,0.5); transition:width .05s linear; }
  #thresholdMark{
    position:absolute; top:0; bottom:0; width:2px; background:var(--warn); left:0;
  }
  .scale{ display:flex; justify-content:space-between; color:var(--dim); font-size:10px; margin-bottom:22px; }

  .readout{ display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; margin-bottom:24px; }
  .cell{ border:1px solid rgba(0,229,255,0.18); padding:10px 12px; }
  .cell .k{ color:var(--dim); font-size:10px; letter-spacing:2px; text-transform:uppercase; }
  .cell .v{ font-size:20px; }

  button{
    background:none; border:1px solid var(--cyan); color:var(--cyan);
    font-family:inherit; font-size:12px; letter-spacing:2px; text-transform:uppercase;
    padding:11px 16px; cursor:pointer; margin:0 8px 10px 0;
  }
  button:hover:not(:disabled){ background:rgba(0,229,255,0.14); }
  button:disabled{ opacity:0.35; cursor:default; }

  #status{ margin:18px 0; min-height:24px; }
  .results{ border-top:1px solid rgba(0,229,255,0.25); margin-top:26px; padding-top:20px; display:none; }
  .results.show{ display:block; }
  table{ width:100%; border-collapse:collapse; font-size:12px; margin-bottom:18px; }
  td{ padding:6px 0; border-bottom:1px solid rgba(0,229,255,0.1); }
  td:last-child{ text-align:right; }
  .verdict{ padding:14px; border:1px solid; font-size:13px; }
  .verdict.ok{ border-color:var(--ok); color:var(--ok); }
  .verdict.warn{ border-color:var(--warn); color:var(--warn); }
  .verdict.bad{ border-color:var(--bad); color:var(--bad); }
  code{ color:#fff; }
  .note{ color:var(--dim); font-size:11px; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>MICROPHONE CHECK</h1>
  <div class="sub">Checks the one rule JARVIS listens by: any sound above the minimum keeps him listening, and one full second below it means you have finished.</div>

  <div class="meter">
    <div id="bar"></div>
    <div id="thresholdMark" title="the minimum (VAD_LEVEL)"></div>
  </div>
  <div class="scale"><span>0.000</span><span>0.025</span><span>0.050</span><span>0.075+</span></div>

  <div class="readout">
    <div class="cell"><div class="k">live level (RMS)</div><div class="v" id="live">—</div></div>
    <div class="cell"><div class="k">in decibels</div><div class="v" id="db">—</div></div>
  </div>

  <div>
    <button id="startBtn">Start microphone</button>
    <button id="roomBtn" disabled>1 · Measure the room (5s)</button>
    <button id="voiceBtn" disabled>2 · Measure your voice (5s)</button>
  </div>

  <div id="status">Press start, then allow the microphone.</div>

  <div class="results" id="results">
    <table id="table"></table>
    <div id="verdict" class="verdict"></div>
    <div class="note" id="advice"></div>
  </div>
</div>

<script>
/* The same maths as JARVIS's detector, deliberately duplicated rather than
   approximated: an RMS over one analyser frame of time-domain samples. If
   the numbers here did not come from the identical calculation, comparing
   them against the thresholds below would be meaningless. */
/* Copied from dist/index.html, not approximated. Change them there and they
   must change here, or this page starts judging a rule JARVIS no longer uses. */
const VAD_LEVEL          = 0.020;
const VAD_END_SILENCE_MS = 1000;
const VAD_METER_MS       = 50;
const toDb = rms => rms > 0 ? (20 * Math.log10(rms)).toFixed(1) : '-inf';

let ctx, analyser, buf, stream, running = false;
let latest = 0;
const currentThreshold = VAD_LEVEL;
let roomFloor = null, voiceLevel = null, roomRaw = null, voiceRaw = null;

const $ = id => document.getElementById(id);

async function start(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      /* Matching JARVIS exactly. These processors change the levels — with
         AGC on, a quiet voice is boosted — so measuring without them would
         produce numbers that do not apply. */
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  }catch(err){
    $('status').textContent = 'Microphone refused: ' + err.message;
    return;
  }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 512;
  src.connect(analyser);
  buf = new Uint8Array(analyser.fftSize);
  running = true;
  $('startBtn').disabled = true;
  $('roomBtn').disabled = false;
  $('status').textContent = 'Running. Step 1: stay quiet and measure the room.';
  tick();
}

function sample(){
  analyser.getByteTimeDomainData(buf);
  let sum = 0;
  for(let i = 0; i < buf.length; i++){ const v = (buf[i] - 128) / 128; sum += v * v; }
  return Math.sqrt(sum / buf.length);
}

function tick(){
  if(!running) return;
  latest = sample();
  $('live').textContent = latest.toFixed(4);
  $('db').textContent = toDb(latest) + ' dBFS';
  $('bar').style.width = Math.min(100, (latest / 0.075) * 100) + '%';
  $('bar').style.background = latest > currentThreshold
    ? 'rgba(61,220,132,0.55)' : 'rgba(0,229,255,0.35)';
  $('thresholdMark').style.left = Math.min(100, (currentThreshold / 0.075) * 100) + '%';
  requestAnimationFrame(tick);
}

/* Averaging alone would be misleading for speech, which is mostly gaps: the
   mean of a spoken sentence sits far below the level of the words in it.
   The median of the loud half is much closer to what the detector has to
   catch, so that is what is reported. */
function collect(seconds, onDone){
  const samples = [];
  const id = setInterval(()=> samples.push(latest), VAD_METER_MS);
  let left = seconds;
  const countdown = setInterval(()=>{
    left--;
    if(left > 0) $('status').textContent = 'Measuring… ' + left + 's';
  }, 1000);
  setTimeout(()=>{
    clearInterval(id); clearInterval(countdown);
    const raw = samples.slice();          // time order, before sorting loses it
    samples.sort((a,b)=> a-b);
    onDone({
      median: samples[Math.floor(samples.length / 2)],
      quiet:  samples[Math.floor(samples.length * 0.2)],
      loud:   samples[Math.floor(samples.length * 0.75)],
      peak:   samples[samples.length - 1],
      raw:    raw
    });
  }, seconds * 1000);
}

/* What actually decides whether a turn ends: not the room's average, but
   whether it ever stays under the minimum for a whole second. Every
   one-second stretch of the recording is checked; the share that stayed
   under is how often he would notice you had finished on time. */
function quietSecondShare(raw){
  const need = Math.round(VAD_END_SILENCE_MS / VAD_METER_MS);
  if(!raw || raw.length < need) return null;
  let good = 0, total = 0;
  for(let i = 0; i + need <= raw.length; i++){
    total++;
    let quiet = true;
    for(let j = i; j < i + need; j++) if(raw[j] >= VAD_LEVEL){ quiet = false; break; }
    if(quiet) good++;
  }
  return good / total;
}
/* The longest stretch under the minimum while you were talking. A gap of a
   full second or more is where a turn would be sent early. */
function longestQuietMs(raw){
  let run = 0, best = 0;
  for(const v of raw || []){ run = v < VAD_LEVEL ? run + 1 : 0; if(run > best) best = run; }
  return best * VAD_METER_MS;
}
const pct = (arr, p) => { const s = arr.slice().sort((a,b)=> a-b); return s[Math.min(s.length - 1, Math.floor(s.length * p))]; };

$('startBtn').addEventListener('click', start);

$('roomBtn').addEventListener('click', ()=>{
  $('roomBtn').disabled = true;
  $('status').textContent = 'Stay quiet… 5s';
  collect(5, r=>{
    roomFloor = r.median;
    roomRaw = r.raw;
    $('status').textContent = 'Room measured. Step 2: speak normally for 5 seconds.';
    $('voiceBtn').disabled = false;
    render();
  });
});

$('voiceBtn').addEventListener('click', ()=>{
  $('voiceBtn').disabled = true;
  $('status').textContent = 'Speak normally… 5s';
  collect(5, r=>{
    voiceLevel = r.loud;      // the level of the words, not the gaps
    voiceRaw = r.raw;
    $('status').textContent = 'Done.';
    $('roomBtn').disabled = false;
    $('voiceBtn').disabled = false;
    render();
  });
});

function render(){
  if(roomFloor === null) return;
  const quiet = quietSecondShare(roomRaw);
  const roomHigh = pct(roomRaw, 0.95);
  const rows = [
    ['Room noise (5s median)', roomFloor.toFixed(4) + '  (' + toDb(roomFloor) + ' dBFS)'],
    ['Room at its loudest (95th percentile)', roomHigh.toFixed(4) + '  (' + toDb(roomHigh) + ' dBFS)'],
    ['The minimum JARVIS uses (VAD_LEVEL)', VAD_LEVEL.toFixed(4) + '  (' + toDb(VAD_LEVEL) + ' dBFS)'],
    ['Minimum above the room', (VAD_LEVEL / roomFloor).toFixed(1) + '×'],
    ['Seconds of room that read as silence', quiet === null ? '—' : Math.round(quiet * 100) + '%']
  ];
  let suggest = null, gap = null;
  if(voiceLevel !== null){
    gap = longestQuietMs(voiceRaw);
    /* The geometric middle of room and voice: the same ratio of headroom on
       both sides, which is how 0.020 was chosen in the first place. */
    suggest = Math.sqrt(roomFloor * voiceLevel);
    rows.push(['Your speaking level', voiceLevel.toFixed(4) + '  (' + toDb(voiceLevel) + ' dBFS)']);
    rows.push(['Voice above the minimum', (voiceLevel / VAD_LEVEL).toFixed(1) + '×']);
    rows.push(['Longest gap under the minimum while talking', gap + 'ms']);
    rows.push(['Middle of room and voice (suggested VAD_LEVEL)', suggest.toFixed(4)]);
  }
  $('table').innerHTML = rows.map(r=> '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('');
  $('results').classList.add('show');

  const v = $('verdict'), a = $('advice');
  const change = s => ' Set <code>VAD_LEVEL</code> in dist/index.html (and here) to about <code>' + s.toFixed(3) + '</code>.';
  if(quiet !== null && quiet < 0.95){
    v.className = 'verdict bad';
    v.textContent = 'The room itself crosses the minimum — only ' + Math.round(quiet * 100) + '% of its seconds read as silence, so JARVIS will often wait past the end of what you said.';
    a.innerHTML = 'Quiet the room (a fan, an open window) or raise the minimum.' + (suggest ? change(Math.max(suggest, roomHigh * 1.5)) : ' Measure your voice too, for a suggested value.');
    return;
  }
  if(voiceLevel === null){
    v.className = 'verdict ok';
    v.textContent = 'The room stays under the minimum. Now measure your voice.';
    a.textContent = '';
    return;
  }
  const margin = voiceLevel / VAD_LEVEL;
  if(margin >= 2){
    v.className = 'verdict ok';
    v.textContent = 'Good. Your voice is ' + margin.toFixed(1) + '× the minimum and the room stays under it, so every sentence keeps him listening and one second of quiet sends it.';
    a.textContent = gap >= VAD_END_SILENCE_MS
      ? 'You paused for ' + gap + 'ms while talking — a pause that long sends what you had said so far.' : '';
  } else if(margin >= 1.3){
    v.className = 'verdict warn';
    v.textContent = 'Workable but tight — your voice is only ' + margin.toFixed(2) + '× the minimum. Softer words may fall under it.';
    a.innerHTML = 'Move closer to the microphone, or lower the minimum.' + change(suggest);
  } else {
    v.className = 'verdict bad';
    v.textContent = 'Your voice barely clears the minimum (' + margin.toFixed(2) + '×). JARVIS will miss a lot of what you say.';
    a.innerHTML = 'Move closer or switch microphone.' + change(suggest);
  }
}
</script>
</body>
</html>
