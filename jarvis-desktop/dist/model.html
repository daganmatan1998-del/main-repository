<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JARVIS — 3D</title>
<!--
  A window of its own, deliberately NOT index.html with a flag.

  The orb's page is one 600KB file that starts a microphone, a scheduler, a
  hologram and a conversation the moment it loads. Opening a second copy of
  that to look at a mesh would run all of it twice. This is the viewer and
  nothing else, off the same vendored three.js.

  Since 2.9.3 the window has no frame and no background: the model floats on
  the desktop by itself. Drag turns it, the wheel zooms, Shift- or Alt-drag
  moves the window, and the only ways to close it are right-click → Close
  and the taskbar — which is what he asked for.

  The model to show arrives in the query string: model.html?glb=<url>.
-->
<style>
  :root{ --cyan:#5fe8ff; --dim:170,200,220; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:transparent; overflow:hidden;
             font-family:'Courier New',monospace; color:var(--cyan); user-select:none; }
  #stage{ position:absolute; inset:0; }
  canvas{ display:block; background:transparent; }
  #note{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-size:12px; letter-spacing:2px; color:var(--cyan);
    text-shadow:0 0 8px rgba(95,232,255,0.9), 0 0 2px #000; pointer-events:none;
  }
  #hint{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%); white-space:nowrap;
    font-size:10px; letter-spacing:1.5px; color:rgba(var(--dim),0.9);
    text-shadow:0 0 3px #000, 0 0 6px #000; pointer-events:none;
    opacity:0; transition:opacity .6s ease;
  }
  #hint.show{ opacity:1; }
  #err{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(86%,360px);
    padding:14px; font-size:12px; line-height:1.6; color:#ffb3b3;
    background:rgba(5,7,13,0.82); border:1px solid rgba(255,120,120,0.35); border-radius:8px;
  }
  #menu{
    position:fixed; display:none; min-width:150px; padding:4px 0; z-index:10;
    background:rgba(5,7,13,0.92); border:1px solid rgba(95,232,255,0.35); border-radius:6px;
    box-shadow:0 6px 24px rgba(0,0,0,0.5), 0 0 12px rgba(95,232,255,0.15);
  }
  #menu.open{ display:block; }
  #menu button{
    display:block; width:100%; padding:7px 14px; text-align:left; background:none; border:none;
    color:var(--cyan); font-family:inherit; font-size:11px; letter-spacing:1.5px; cursor:pointer;
  }
  #menu button:hover{ background:rgba(95,232,255,0.14); }
  #menu button.on::after{ content:' \2713'; }
  #menu hr{ border:none; border-top:1px solid rgba(95,232,255,0.18); margin:4px 0; }
  #menu #closeItem{ color:#ff9d9d; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="note">loading…</div>
<div id="hint">drag to turn · shift+drag to move · right-click to close</div>
<div id="menu" role="menu">
  <button id="spinBtn" class="on" role="menuitem">SPIN</button>
  <button id="wireBtn" role="menuitem">WIREFRAME</button>
  <button id="fitBtn" role="menuitem">FIT</button>
  <hr>
  <button id="closeItem" role="menuitem">CLOSE</button>
</div>

<script src="./vendor/three/build/three.min.js"></script>
<script src="./vendor/three/examples/js/loaders/GLTFLoader.js"></script>
<script src="./vendor/three/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  "use strict";
  const note = document.getElementById('note');
  const stage = document.getElementById('stage');
  const menu = document.getElementById('menu');
  const hint = document.getElementById('hint');
  const tauriWin = () => {
    try{ return window.__TAURI__ && window.__TAURI__.window && window.__TAURI__.window.getCurrentWindow(); }
    catch(e){ return null; }
  };

  /* The one way out besides the taskbar. Wired before anything else, so
     even a window whose model failed to load can still be closed. */
  function closeWindow(){
    const w = tauriWin();
    if(w && typeof w.close === 'function') w.close().catch(() => window.close());
    else window.close();
  }
  function openMenu(x, y){
    menu.classList.add('open');
    const r = menu.getBoundingClientRect();
    menu.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 4)) + 'px';
    menu.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 4)) + 'px';
  }
  function closeMenu(){ menu.classList.remove('open'); }
  document.addEventListener('contextmenu', (e) => { e.preventDefault(); openMenu(e.clientX, e.clientY); });
  document.addEventListener('pointerdown', (e) => { if(!menu.contains(e.target)) closeMenu(); }, true);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeMenu(); });
  document.getElementById('closeItem').addEventListener('click', closeWindow);

  /* Moving a window that has no title bar: Shift- or Alt-drag anywhere.
     Taken in the capture phase, before the orbit controls see the press. */
  stage.addEventListener('pointerdown', (e) => {
    if(e.button !== 0 || !(e.shiftKey || e.altKey)) return;
    const w = tauriWin();
    if(!w || typeof w.startDragging !== 'function') return;
    e.preventDefault(); e.stopPropagation();
    w.startDragging().catch(() => {});
  }, true);

  function fail(msg){
    note.style.display = 'none';
    const box = document.createElement('div');
    box.id = 'err';
    box.textContent = msg + ' Right-click to close.';
    stage.appendChild(box);
  }
  if(!window.THREE){ fail('three.js did not load from ./vendor/three/.'); return; }

  const glb = new URLSearchParams(location.search).get('glb');
  if(!glb){ fail('No model was given. This window is opened by JARVIS with a model to show.'); return; }

  /* Transparent all the way down: the page, the canvas and the scene. What
     is left on the desktop is the model and nothing around it. */
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, premultipliedAlpha:true, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.physicallyCorrectLights = true;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = null;
  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 2000);

  /* Three lights, not one. A single source makes every curve read as a flat
     silhouette; a key, a fill from the opposite side and a rim behind are
     what let you see the shape of a thing you are about to manufacture. */
  scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x0a1018, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 2.1);  key.position.set(4, 6, 5);
  const fill = new THREE.DirectionalLight(0x9fd0ff, 0.7); fill.position.set(-5, 2, -3);
  const rim  = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(0, 3, -6);
  scene.add(key, fill, rim);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;          // the right button belongs to the menu

  let model = null, spin = true, wire = false;
  /* Gesture zoom's distance, eased toward (see below). */
  let fitDist = 0, wantDist = 0;

  function resize(){
    const w = innerWidth, h = Math.max(1, innerHeight);
    renderer.setSize(w, h, false);
    renderer.domElement.style.width = w + 'px';
    renderer.domElement.style.height = h + 'px';
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);

  /* Framed from the bounding sphere and the NARROWER of the two fields of
     view, so a wide flat object still fits when the window is tall and thin. */
  function frame(){
    if(!model) return;
    const sphere = new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());
    const vFov = camera.fov * Math.PI / 180;
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
    const dist = (sphere.radius / Math.sin(Math.min(vFov, hFov) / 2)) * 1.15;
    fitDist = dist; wantDist = 0;
    /* The closest the camera may come is just outside the model's bounding
       sphere — a fraction of the framing distance put it INSIDE a turned
       box, where everything is culled and the window goes empty. */
    controls.minDistance = sphere.radius * 1.15;
    controls.maxDistance = dist * 8;
    controls.target.copy(sphere.center);
    camera.position.set(sphere.center.x, sphere.center.y + sphere.radius * 0.3, sphere.center.z + dist);
    camera.near = Math.max(0.001, dist / 1000);
    camera.far = dist * 20;
    camera.updateProjectionMatrix();
    controls.update();
  }

  const shown = (gltf)=>{
    model = gltf.scene;
    scene.add(model);
    resize();
    frame();
    note.style.display = 'none';
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 4500);
  };
  const lost = ()=>{
    fail('The model could not be loaded. The link may have expired — ask JARVIS to make it again.');
  };
  /* A model JARVIS built in code is not at an address: the orb left the
     .glb with the app (stash_model in main.rs) and it is asked for here. */
  if(glb.indexOf('stash:') === 0){
    const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
    if(!invoke) lost();
    else invoke('stashed_model', { key: glb.slice(6) }).then((b64)=>{
      const bin = atob(String(b64 || ''));
      const bytes = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      new THREE.GLTFLoader().parse(bytes.buffer, '', shown, lost);
    }).catch(lost);
  } else {
    new THREE.GLTFLoader().load(glb, shown, (ev)=>{
      if(ev && ev.total) note.textContent = 'loading… ' + Math.round(ev.loaded / ev.total * 100) + '%';
    }, lost);
  }

  document.getElementById('spinBtn').addEventListener('click', (e)=>{
    spin = !spin; e.target.classList.toggle('on', spin); closeMenu();
  });
  document.getElementById('wireBtn').addEventListener('click', (e)=>{
    wire = !wire; e.target.classList.toggle('on', wire); closeMenu();
    if(model) model.traverse(o => { if(o.isMesh && o.material) o.material.wireframe = wire; });
  });
  document.getElementById('fitBtn').addEventListener('click', ()=>{ frame(); closeMenu(); });

  /* GESTURE ZOOM, directly. The camera window tracks his two pinches and,
     when this viewer is the window in front, sends the zoom here as a
     factor instead of as wheel notches: the camera moves along its line to
     the model's centre (the orbit target), eased so each step glides, and
     stays between a close-up and eight times the framing distance. The
     window itself never changes size. */
  function zoomBy(factor){
    if(!model || !fitDist || !(factor > 0)) return;
    const now = camera.position.distanceTo(controls.target);
    const from = wantDist || now;
    wantDist = Math.min(controls.maxDistance, Math.max(controls.minDistance, from / factor));
  }
  (function listenForGestures(){
    const ev = window.__TAURI__ && window.__TAURI__.event;
    if(!ev || !ev.listen) return;
    ev.listen('jarvis://model-zoom', (e) => {
      const p = (e && e.payload) || {};
      if(p.end){ return; }
      zoomBy(Number(p.factor));
    }).catch(() => {});
  })();
  window.__jarvisModelZoom = zoomBy;   // the same entry point, for tests

  resize();
  (function tick(){
    requestAnimationFrame(tick);
    if(wantDist){
      const off = camera.position.clone().sub(controls.target);
      const len = off.length();
      const next = len + (wantDist - len) * 0.25;
      off.setLength(next);
      camera.position.copy(controls.target).add(off);
      camera.near = Math.max(0.001, next / 1000);
      camera.updateProjectionMatrix();
      if(Math.abs(wantDist - next) < wantDist * 0.002) wantDist = 0;
    }
    if(spin && model) model.rotation.y += 0.004;
    controls.update();
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
