<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>נוטרי — תוכנית תזונה אישית</title>
  <meta name="description" content="תוכנית תזונה אישית לחיטוב, שמירה ומסה, עם עוזר תזונה ומעקב התקדמות שבועי.">
  <meta name="theme-color" content="#f4f7f5">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="נוטרי">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/rubik-hebrew-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a light/dark flash.
    try {
      var t = localStorage.getItem('nutri-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">דלג לתוכן</a>
  <div id="offline-banner" role="status">אין חיבור לאינטרנט — הנתונים והתפריט זמינים במכשיר</div>
  <main id="view" tabindex="-1">
    <div id="splash" aria-label="טוען">
      <img src="icons/icon-192.png" alt="" width="72" height="72">
    </div>
  </main>
  <nav id="tabbar" aria-label="ניווט ראשי" hidden></nav>
  <noscript><p style="padding:24px">האפליקציה דורשת JavaScript.</p></noscript>
</body>
</html>
