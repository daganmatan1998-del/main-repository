<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1b54" />
    <meta name="description" content="Read & Defend — a castle-defense reading game that teaches children to read Hebrew and English." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Read &amp; Defend</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Andika: designed for beginning readers (single-storey a and g).
         Noto Sans Hebrew: full niqqud support. Fredoka: friendly UI, Latin + Hebrew.
         Every one has a system fallback, so the game works offline without them. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&family=Noto+Sans+Hebrew:wght@500;700;800&display=swap" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div id="layer"></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="devBanner" hidden></div>
    </div>
    <noscript>Read &amp; Defend needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
